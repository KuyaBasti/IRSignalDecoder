<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="IR Signal Decoder system overview: a TV remote's IR bursts reach an IR receiver on PIN_58. On the CC3200 a both-edge GPIO interrupt restarts SysTick on each falling edge, reads the elapsed microseconds on each rising edge, and decodes a 12-bit button code. The multi-tap main loop, which also reads global_time from the SysTick handler, turns codes into letters, draws them through the display stack (Adafruit GFX plus the OLED driver) on a 128x128 SSD1351 OLED over 100 kHz SPI, logs to a serial terminal over UART0 with Report(), and exchanges dollar-terminated messages with a second CC3200 over UART1 at 115200 8N1.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="560" rx="12"/>
  <text class="title" x="32" y="48">IR Signal Decoder — system overview</text>
  <text class="sub" x="32" y="74">An IR interrupt decodes 12-bit remote codes; the main loop types them as multi-tap text, shown and sent over UART1.</text>

  <!-- ===== Row 1: hardware on the desk ===== -->
  <rect class="b-orange" x="32" y="100" width="160" height="60" rx="10"/>
  <text class="lbl" x="112" y="126" text-anchor="middle">TV remote</text>
  <text class="note" x="112" y="145" text-anchor="middle">12-bit button codes</text>

  <rect class="b-orange" x="268" y="100" width="180" height="60" rx="10"/>
  <text class="lbl" x="358" y="126" text-anchor="middle">IR receiver</text>
  <text class="note" x="358" y="145" text-anchor="middle">demodulator, active low</text>

  <rect class="b-orange" x="528" y="100" width="200" height="60" rx="10"/>
  <text class="lbl" x="628" y="126" text-anchor="middle">Serial terminal</text>
  <text class="note" x="628" y="145" text-anchor="middle">LaunchPad USB backchannel</text>

  <rect class="b-blue" x="804" y="100" width="160" height="60" rx="10"/>
  <text class="lbl" x="884" y="126" text-anchor="middle">Second CC3200</text>
  <text class="note" x="884" y="145" text-anchor="middle">same firmware</text>

  <path class="edge" d="M192,130 H264" marker-end="url(#ah)"/>
  <text class="elbl" x="228" y="122" text-anchor="middle">IR bursts</text>

  <!-- ===== The board: firmware ===== -->
  <rect class="group" x="20" y="190" width="956" height="232" rx="12"/>
  <text class="glbl" x="36" y="211">CC3200 LAUNCHPAD · FIRMWARE</text>

  <rect class="b-green" x="32" y="226" width="160" height="60" rx="10"/>
  <text class="lbl" x="112" y="252" text-anchor="middle">SysTick timer</text>
  <text class="note" x="112" y="271" text-anchor="middle">40 ms reload at 80 MHz</text>

  <rect class="b-green" x="268" y="226" width="180" height="60" rx="10"/>
  <text class="lbl" x="358" y="252" text-anchor="middle">IR decoder ISR</text>
  <text class="note" x="358" y="271" text-anchor="middle">&gt; 2 ms start + 12 bits</text>

  <rect class="b-green" x="528" y="226" width="200" height="60" rx="10"/>
  <text class="lbl" x="628" y="252" text-anchor="middle">Multi-tap main loop</text>
  <text class="note" x="628" y="271" text-anchor="middle">codes → letters, MUTE sends</text>

  <rect class="b-green" x="804" y="226" width="160" height="60" rx="10"/>
  <text class="lbl" x="884" y="252" text-anchor="middle">UART1 link</text>
  <text class="note" x="884" y="271" text-anchor="middle">'$' ends each message</text>

  <rect class="b-green" x="528" y="346" width="200" height="60" rx="10"/>
  <text class="lbl" x="628" y="372" text-anchor="middle">Display stack</text>
  <text class="note" x="628" y="391" text-anchor="middle">Adafruit GFX + OLED driver</text>

  <!-- receiver -> ISR -->
  <path class="edge" d="M358,160 V222" marker-end="url(#ah)"/>
  <text class="elbl" x="366" y="181">PIN_58 · both edges</text>

  <!-- ISR uses SysTick as a stopwatch -->
  <path class="edge" d="M268,244 H196" marker-end="url(#ah)"/>
  <text class="elbl" x="230" y="236" text-anchor="middle">restart</text>
  <path class="edge" d="M192,268 H264" marker-end="url(#ah)"/>
  <text class="elbl" x="230" y="284" text-anchor="middle">elapsed µs</text>

  <!-- ISR -> main loop -->
  <path class="edge" d="M448,248 H524" marker-end="url(#ah)"/>
  <text class="elbl" x="488" y="240" text-anchor="middle">12-bit code</text>

  <!-- SysTick wrap handler -> main loop -->
  <path class="edge" d="M112,286 V320 H488 V272 H524" marker-end="url(#ah)"/>
  <text class="elbl" x="300" y="338" text-anchor="middle">global_time</text>

  <!-- main loop -> serial terminal -->
  <path class="edge" d="M628,226 V164" marker-end="url(#ah)"/>
  <text class="elbl" x="636" y="181">UART0 · Report()</text>

  <!-- main loop <-> UART1 link <-> second board -->
  <path class="edge" d="M728,246 H800" marker-end="url(#ah)"/>
  <text class="elbl" x="766" y="238" text-anchor="middle">msg + '$'</text>
  <path class="edge" d="M804,268 H732" marker-end="url(#ah)"/>
  <text class="elbl" x="766" y="284" text-anchor="middle">received</text>
  <path class="edge" d="M884,222 V164" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="elbl" x="876" y="181" text-anchor="end">UART1 · 115200 8N1</text>

  <!-- main loop -> display stack -> OLED -->
  <path class="edge" d="M628,286 V342" marker-end="url(#ah)"/>
  <text class="elbl" x="636" y="321">drawChar · fillRect</text>
  <path class="edge" d="M628,406 V472" marker-end="url(#ah)"/>
  <text class="elbl" x="636" y="446">SPI · 100 kHz</text>

  <!-- ===== Row 4: the screen ===== -->
  <rect class="b-orange" x="528" y="476" width="200" height="60" rx="10"/>
  <text class="lbl" x="628" y="502" text-anchor="middle">SSD1351 OLED</text>
  <text class="note" x="628" y="521" text-anchor="middle">128×128, rows 0 and 64</text>

  <!-- tiny legend -->
  <rect class="b-green" x="32" y="482" width="14" height="10" rx="2"/>
  <text class="note" x="52" y="491">firmware in this repo</text>
  <rect class="b-orange" x="32" y="504" width="14" height="10" rx="2"/>
  <text class="note" x="52" y="513">off-board, per README wiring</text>
  <rect class="b-blue" x="260" y="482" width="14" height="10" rx="2"/>
  <text class="note" x="280" y="491">peer board, per README</text>
</svg>
