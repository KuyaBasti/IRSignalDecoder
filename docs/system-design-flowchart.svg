<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1296" width="1000" height="1296" role="img" aria-label="IR Signal Decoder end-to-end flowchart: a TV remote's IR bursts reach an IR demodulator on PIN_58; a both-edge GPIO interrupt clears the SysTick count on each falling edge and reads it on each rising edge, and builds a 12-bit code from 13 low pulses (start pulse over 2000 microseconds, then 12 data pulses, 1000 microseconds or less is a 1) and raises pin_out_intflag after the last one. SysTick counts a 40 ms period that every falling edge restarts, and on each wrap SysTickHandler adds 40 to global_time; systick_cnt, meant to signal that a transmission ended, is counted but never read. The main loop applies a 200 ms repeat gate, clears row 64 after a send, runs the multi-tap commit rule with a 1500 ms window, and switches on the code; MUTE sends msg plus a dollar sign with UART1Send to a second CC3200, and each pass polls UART1, where UART1Receive collects up to a dollar sign or 20 bytes and the text is drawn on row 0. drawChar goes through Adafruit_GFX to the Adafruit_OLED.c driver, fillRect goes to the driver directly, and the driver drives a 100 kHz GSPI and CS, DC and RESET GPIOs to a 128 by 128 SSD1351 OLED. Report lines go to a PC serial terminal on UART0.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" width="1000" height="1296" rx="12"/>
  <text class="title" x="32" y="48">IR Signal Decoder — end-to-end flowchart</text>
  <text class="sub" x="32" y="74">One both-edge GPIO interrupt decodes 12-bit IR codes; a polling loop types, draws and sends them.</text>

  <!-- ===== Hardware input ===== -->
  <rect class="group" x="24" y="92" width="500" height="112" rx="12"/>
  <text class="glbl" x="40" y="114">HARDWARE INPUT</text>
  <rect class="b-orange" x="64" y="128" width="170" height="62" rx="10"/>
  <text class="lbl" x="149" y="154.5" text-anchor="middle">TV remote</text>
  <text class="note" x="149" y="173.5" text-anchor="middle">12-bit pulse-width codes</text>
  <rect class="b-orange" x="294" y="128" width="210" height="62" rx="10"/>
  <text class="lbl" x="399" y="154.5" text-anchor="middle">IR demodulator</text>
  <text class="note" x="399" y="173.5" text-anchor="middle">OUT → PIN_58, idle high</text>
  <path class="edge" d="M234,159 H290" marker-end="url(#ah)"/>
  <text class="elbl" x="264" y="151" text-anchor="middle">IR bursts</text>
  <path class="edge" d="M399,190 V262" marker-end="url(#ah)"/>

  <!-- ===== Interrupt layer ===== -->
  <rect class="group" x="24" y="228" width="952" height="248" rx="12"/>
  <text class="glbl" x="40" y="250">INTERRUPT LAYER — main.c</text>
  <rect class="b-green" x="64" y="266" width="360" height="76" rx="10"/>
  <text class="lbl" x="244" y="290" text-anchor="middle">GPIOA0IntHandler — PIN_58, both edges</text>
  <text class="note" x="244" y="309" text-anchor="middle">falling: clear SysTick count; opens a frame if idle</text>
  <text class="note" x="244" y="328" text-anchor="middle">rising: delta = low-pulse width in µs</text>
  <rect class="b-green" x="600" y="266" width="360" height="76" rx="10"/>
  <text class="lbl" x="780" y="290" text-anchor="middle">SysTick timer — 40 ms period</text>
  <text class="note" x="780" y="309" text-anchor="middle">3,200,000 ticks @ 80 MHz · each falling edge restarts it</text>
  <text class="note" x="780" y="328" text-anchor="middle">wrap → SysTickHandler: global_time += 40</text>
  <rect class="b-green" x="64" y="370" width="360" height="76" rx="10"/>
  <text class="lbl" x="244" y="394" text-anchor="middle">frame builder (same ISR)</text>
  <text class="note" x="244" y="413" text-anchor="middle">pulse 0: start bit, &gt; 2000 µs or the frame aborts</text>
  <text class="note" x="244" y="432" text-anchor="middle">pulses 1–12: data &lt;&lt;= 1; ≤ 1000 µs → 1, else 0</text>
  <rect class="b-planned" x="600" y="370" width="360" height="76" rx="10"/>
  <text class="lbl" x="780" y="394" text-anchor="middle">systick_cnt — 'transmission ended'</text>
  <text class="note" x="780" y="413" text-anchor="middle">++ every wrap, zeroed by falling edges</text>
  <text class="note" x="780" y="432" text-anchor="middle">read by nothing; SysTickReset() never called</text>

  <!-- GPIO ISR uses the SysTick counter as a stopwatch -->
  <path class="edge-dash" d="M424,302 H596" marker-end="url(#ah)"/>
  <text class="elbl" x="510" y="280" text-anchor="middle">falling: clears its count</text>
  <text class="elbl" x="510" y="294" text-anchor="middle">rising: reads it back</text>
  <path class="edge" d="M244,342 V366" marker-end="url(#ah)"/>
  <text class="elbl" x="254" y="359">delta per rising edge</text>
  <path class="edge-dash" d="M780,342 V366" marker-end="url(#ah)"/>

  <!-- global_time into the loop's two time windows -->
  <path class="edge-dash" d="M600,332 H460 V590 H428" marker-end="url(#ah)"/>
  <path class="edge-dash" d="M460,590 V788 H428" marker-end="url(#ah)"/>
  <text class="elbl" x="470" y="398">global_time (ms)</text>
  <text class="elbl" x="470" y="412">read by the loop</text>

  <!-- ===== Main loop ===== -->
  <rect class="group" x="24" y="500" width="688" height="452" rx="12"/>
  <text class="glbl" x="40" y="522">MAIN LOOP</text>
  <text class="glbl" x="40" y="538">while(1) in main.c</text>
  <path class="edge-dash" d="M244,446 V548" marker-end="url(#ah)"/>
  <text class="elbl" x="254" y="522">after pulse 12: pin_out_intflag = 1</text>
  <text class="elbl" x="254" y="536">12-bit code stays in data</text>

  <rect class="b-blue" x="64" y="552" width="360" height="76" rx="10"/>
  <text class="lbl" x="244" y="576" text-anchor="middle">repeat gate — 200 ms</text>
  <text class="note" x="244" y="595" text-anchor="middle">accept only if ≥ 200 ms since the last accepted code</text>
  <text class="note" x="244" y="614" text-anchor="middle">otherwise ignored as repeated data</text>
  <path class="edge" d="M244,628 V652" marker-end="url(#ah)"/>
  <text class="elbl" x="254" y="645">accepted</text>
  <rect class="b-blue" x="64" y="656" width="360" height="66" rx="10"/>
  <text class="lbl" x="244" y="684.5" text-anchor="middle">fresh line after a send</text>
  <text class="note" x="244" y="703.5" text-anchor="middle">if message_sent: erase row 64, x = 6, msg = ""</text>
  <path class="edge" d="M244,722 V746" marker-end="url(#ah)"/>
  <rect class="b-blue" x="64" y="750" width="360" height="76" rx="10"/>
  <text class="lbl" x="244" y="774" text-anchor="middle">multi-tap engine</text>
  <text class="note" x="244" y="793" text-anchor="middle">new key, or ≥ 1500 ms since the last press → commit</text>
  <text class="note" x="244" y="812" text-anchor="middle">pending letter to msg[] (not after 1 / MUTE / LAST)</text>
  <path class="edge" d="M244,826 V852" marker-end="url(#ah)"/>
  <text class="elbl" x="254" y="844">commit: cycle = 0 · else: cycle++</text>
  <rect class="b-blue" x="64" y="856" width="360" height="76" rx="10"/>
  <text class="lbl" x="244" y="880" text-anchor="middle">switch on the 12-bit code</text>
  <text class="note" x="244" y="899" text-anchor="middle">2–9: group’s first letter + cycle mod 3/4, −32 if caps</text>
  <text class="note" x="244" y="918" text-anchor="middle">0 space · 1 caps toggle · LAST delete · MUTE send</text>

  <rect class="b-blue" x="492" y="552" width="210" height="76" rx="10"/>
  <text class="lbl" x="597" y="576" text-anchor="middle">UART1 poll</text>
  <text class="note" x="597" y="595" text-anchor="middle">UARTCharsAvail, every pass</text>
  <text class="note" x="597" y="614" text-anchor="middle">byte waiting → UART1Receive</text>
  <rect class="b-blue" x="492" y="680" width="210" height="76" rx="10"/>
  <text class="lbl" x="597" y="704" text-anchor="middle">show received text</text>
  <text class="note" x="597" y="723" text-anchor="middle">Report, then erase row 0</text>
  <text class="note" x="597" y="742" text-anchor="middle">drawChar at (6 + 6i, 0)</text>

  <!-- ===== UART1 link ===== -->
  <rect class="group" x="732" y="500" width="244" height="452" rx="12"/>
  <text class="glbl" x="748" y="522">UART1 LINK — 115200 8N1</text>
  <text class="glbl" x="748" y="538">PIN_01 TX · PIN_02 RX</text>
  <rect class="b-red" x="752" y="552" width="204" height="76" rx="10"/>
  <text class="lbl" x="854" y="576" text-anchor="middle">UART1Receive</text>
  <text class="note" x="854" y="595" text-anchor="middle">spins until '$' or 20 bytes</text>
  <text class="note" x="854" y="614" text-anchor="middle">'$' dropped · loop is blocked</text>
  <rect class="b-red" x="752" y="690" width="204" height="76" rx="10"/>
  <text class="lbl" x="854" y="714" text-anchor="middle">second CC3200</text>
  <text class="note" x="854" y="733" text-anchor="middle">same firmware (per docs)</text>
  <text class="note" x="854" y="752" text-anchor="middle">no roles, IDs or ACKs</text>
  <rect class="b-red" x="752" y="856" width="204" height="76" rx="10"/>
  <text class="lbl" x="854" y="880" text-anchor="middle">UART1Send</text>
  <text class="note" x="854" y="899" text-anchor="middle">spins on UARTBusy per byte</text>
  <text class="note" x="854" y="918" text-anchor="middle">sends msg up to its NUL</text>

  <path class="edge" d="M702,590 H748" marker-end="url(#ah)"/>
  <path class="edge" d="M752,614 H722 V718 H706" marker-end="url(#ah)"/>
  <path class="edge" d="M854,690 V632" marker-end="url(#ah)"/>
  <text class="elbl" x="864" y="664">peer's msg + '$'</text>
  <path class="edge" d="M854,856 V770" marker-end="url(#ah)"/>
  <text class="elbl" x="864" y="808">msg + '$',</text>
  <text class="elbl" x="864" y="822">byte by byte</text>
  <path class="edge" d="M424,894 H748" marker-end="url(#ah)"/>
  <text class="elbl" x="586" y="886" text-anchor="middle">MUTE: msg + '$'</text>
  <text class="elbl" x="586" y="910" text-anchor="middle">then UtilsDelay(80000)</text>

  <!-- ===== Bundled calls out of the loop ===== -->
  <path class="edge" d="M150,952 V1036" marker-end="url(#ah)"/>
  <text class="elbl" x="160" y="974">drawChar(x, 64) after every key but 1 / MUTE</text>
  <text class="elbl" x="160" y="988">drawChar(6 + 6i, 0) per received char</text>
  <path class="edge" d="M600,952 V1036" marker-end="url(#ah)"/>
  <text class="elbl" x="590" y="974" text-anchor="end">fillRect(0, row, 128, 9)</text>
  <text class="elbl" x="590" y="988" text-anchor="end">erases row 64 or row 0</text>
  <path class="edge" d="M690,952 V1008 H748" marker-end="url(#ah)"/>

  <rect class="b-orange" x="752" y="970" width="204" height="76" rx="10"/>
  <text class="lbl" x="854" y="994" text-anchor="middle">PC serial terminal</text>
  <text class="note" x="854" y="1013" text-anchor="middle">UART0 · Report() lines</text>
  <text class="note" x="854" y="1032" text-anchor="middle">115200 per docs</text>

  <!-- ===== Display path ===== -->
  <rect class="group" x="24" y="1000" width="656" height="272" rx="12"/>
  <text class="glbl" x="40" y="1022">DISPLAY PATH</text>
  <rect class="b-purple" x="64" y="1040" width="260" height="76" rx="10"/>
  <text class="lbl" x="194" y="1064" text-anchor="middle">Adafruit_GFX — drawChar</text>
  <text class="note" x="194" y="1083" text-anchor="middle">5×7 glyph in a 6×8 cell</text>
  <text class="note" x="194" y="1102" text-anchor="middle">48 drawPixel calls, white on black</text>
  <rect class="b-purple" x="404" y="1040" width="256" height="76" rx="10"/>
  <text class="lbl" x="532" y="1064" text-anchor="middle">Adafruit_OLED.c — SSD1351</text>
  <text class="note" x="532" y="1083" text-anchor="middle">drawPixel · fillRect · fillScreen</text>
  <text class="note" x="532" y="1102" text-anchor="middle">per byte: GPIO CS + DC, dummy RX</text>
  <rect class="b-orange" x="64" y="1176" width="260" height="76" rx="10"/>
  <text class="lbl" x="194" y="1200" text-anchor="middle">SSD1351 OLED 128×128</text>
  <text class="note" x="194" y="1219" text-anchor="middle">RGB565 · its RAM is the framebuffer</text>
  <text class="note" x="194" y="1238" text-anchor="middle">row 0 received · row 64 typing</text>
  <rect class="b-purple" x="404" y="1176" width="256" height="76" rx="10"/>
  <text class="lbl" x="532" y="1200" text-anchor="middle">GSPI master — 100 kHz</text>
  <text class="note" x="532" y="1219" text-anchor="middle">mode 0 · 8-bit words</text>
  <text class="note" x="532" y="1238" text-anchor="middle">own CS: SW-controlled, active-high</text>

  <path class="edge" d="M324,1078 H400" marker-end="url(#ah)"/>
  <text class="elbl" x="362" y="1070" text-anchor="middle">drawPixel</text>
  <path class="edge" d="M600,1116 V1172" marker-end="url(#ah)"/>
  <text class="elbl" x="590" y="1142" text-anchor="end">writeCommand / writeData:</text>
  <text class="elbl" x="590" y="1156" text-anchor="end">one SPIDataPut per byte</text>
  <path class="edge" d="M420,1116 V1146 H260 V1172" marker-end="url(#ah)"/>
  <text class="elbl" x="340" y="1138" text-anchor="middle">GPIO CS · DC · RESET</text>
  <path class="edge" d="M404,1214 H328" marker-end="url(#ah)"/>
  <text class="elbl" x="366" y="1206" text-anchor="middle">SCLK, MOSI</text>

  <!-- ===== Legend ===== -->
  <text class="glbl" x="716" y="1080">LEGEND</text>
  <rect class="b-orange" x="716" y="1094" width="26" height="14" rx="4"/>
  <text class="note" x="754" y="1105">hardware outside the CC3200</text>
  <rect class="b-green" x="716" y="1116" width="26" height="14" rx="4"/>
  <text class="note" x="754" y="1127">interrupt layer (ISRs)</text>
  <rect class="b-blue" x="716" y="1138" width="26" height="14" rx="4"/>
  <text class="note" x="754" y="1149">main loop (polling)</text>
  <rect class="b-purple" x="716" y="1160" width="26" height="14" rx="4"/>
  <text class="note" x="754" y="1171">display path</text>
  <rect class="b-red" x="716" y="1182" width="26" height="14" rx="4"/>
  <text class="note" x="754" y="1193">UART1 link + peer board</text>
  <rect class="b-planned" x="716" y="1204" width="26" height="14" rx="4"/>
  <text class="note" x="754" y="1215">in the code, never wired</text>
  <path class="edge" d="M716,1233 H742" marker-end="url(#ah)"/>
  <text class="note" x="754" y="1237">call, signal or data</text>
  <path class="edge-dash" d="M716,1255 H742" marker-end="url(#ah)"/>
  <text class="note" x="754" y="1259">state shared with an ISR</text>
</svg>
