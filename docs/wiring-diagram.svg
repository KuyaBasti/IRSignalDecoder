<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="24" y="32" font-size="13" font-weight="bold" fill="#000000">IR Signal Decoder — wiring (pins per pin_mux_config.c)</text>

  <!-- ============ CC3200 LaunchPad ============ -->
  <text x="365" y="80" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">CC3200 LaunchPad</text>
  <rect x="270" y="88" width="190" height="300" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <!-- left column pins -->
  <text x="278" y="116" font-size="11" fill="#000000">PIN_58 (IR)</text>
  <text x="278" y="140" font-size="11" fill="#000000">3V3</text>
  <text x="278" y="156" font-size="11" fill="#000000">GND</text>
  <text x="278" y="188" font-size="11" fill="#000000">PIN_55 TX0</text>
  <text x="278" y="204" font-size="11" fill="#000000">PIN_57 RX0</text>
  <!-- right column pins -->
  <text x="452" y="116" font-size="11" text-anchor="end" fill="#000000">3V3</text>
  <text x="452" y="132" font-size="11" text-anchor="end" fill="#000000">GND</text>
  <text x="452" y="164" font-size="11" text-anchor="end" fill="#000000">PIN_07 MOSI</text>
  <text x="452" y="180" font-size="11" text-anchor="end" fill="#000000">PIN_05 CLK</text>
  <text x="452" y="212" font-size="11" text-anchor="end" fill="#000000">PIN_18 CS</text>
  <text x="452" y="228" font-size="11" text-anchor="end" fill="#000000">PIN_45 DC</text>
  <text x="452" y="244" font-size="11" text-anchor="end" fill="#000000">PIN_08 RST</text>
  <text x="452" y="272" font-size="11" text-anchor="end" fill="#000000">PIN_50 (n.c.)</text>
  <text x="452" y="288" font-size="11" text-anchor="end" fill="#000000">PIN_06 (n.c.)</text>
  <text x="452" y="320" font-size="11" text-anchor="end" fill="#000000">PIN_01 TX1</text>
  <text x="452" y="336" font-size="11" text-anchor="end" fill="#000000">PIN_02 RX1</text>
  <text x="452" y="352" font-size="11" text-anchor="end" fill="#000000">GND</text>

  <!-- ============ IR receiver (demodulator, D-shape) ============ -->
  <text x="112" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">IR receiver</text>
  <path d="M 130 96 A 36 36 0 0 0 130 168 Z" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="126" y="116" font-size="11" text-anchor="end" fill="#000000">OUT</text>
  <text x="126" y="140" font-size="11" text-anchor="end" fill="#000000">VCC</text>
  <text x="126" y="156" font-size="11" text-anchor="end" fill="#000000">GND</text>
  <!-- incoming light arrows -->
  <line x1="48" y1="108" x2="88" y2="120" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="48" y1="126" x2="88" y2="138" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="36" y="158" font-size="10" fill="#000000">from remote</text>
  <!-- wires IR -> CC3200 -->
  <polyline points="130,112 270,112" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="130,136 270,136" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="130,152 270,152" fill="none" stroke="#000000" stroke-width="1.3"/>

  <!-- ============ OLED ============ -->
  <text x="619" y="88" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Adafruit SSD1351 OLED</text>
  <rect x="560" y="96" width="118" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="568" y="116" font-size="11" fill="#000000">VIN</text>
  <text x="568" y="132" font-size="11" fill="#000000">GND</text>
  <text x="568" y="164" font-size="11" fill="#000000">SI (MOSI)</text>
  <text x="568" y="180" font-size="11" fill="#000000">CL (SCK)</text>
  <text x="568" y="212" font-size="11" fill="#000000">OC (CS)</text>
  <text x="568" y="228" font-size="11" fill="#000000">DC</text>
  <text x="568" y="244" font-size="11" fill="#000000">R (RST)</text>
  <text x="619" y="272" font-size="10" text-anchor="middle" fill="#000000">128 x 128 RGB565</text>
  <!-- wires CC3200 -> OLED (straight lanes) -->
  <polyline points="460,112 560,112" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,128 560,128" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,160 560,160" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,176 560,176" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,208 560,208" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,224 560,224" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,240 560,240" fill="none" stroke="#000000" stroke-width="1.3"/>
  <text x="510" y="154" font-size="10" text-anchor="middle" fill="#000000">SPI 100 kHz</text>

  <!-- ============ USB debug console ============ -->
  <text x="138" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">USB debug (CCS console)</text>
  <rect x="48" y="440" width="180" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="220" y="468" font-size="11" text-anchor="end" fill="#000000">RX</text>
  <text x="220" y="484" font-size="11" text-anchor="end" fill="#000000">TX</text>
  <text x="56" y="468" font-size="10" fill="#000000">on-board USB</text>
  <text x="56" y="484" font-size="10" fill="#000000">backchannel</text>
  <!-- wires PIN_55/PIN_57 -> console -->
  <polyline points="270,184 240,184 240,464 228,464" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="270,200 248,200 248,480 228,480" fill="none" stroke="#000000" stroke-width="1.3"/>
  <text x="232" y="352" font-size="10" text-anchor="end" fill="#000000">UART0 · 115200 8N1</text>

  <!-- ============ Second board ============ -->
  <text x="622" y="432" font-size="12" font-weight="bold" text-anchor="middle" fill="#000000">Second CC3200 (same firmware)</text>
  <rect x="540" y="440" width="164" height="72" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="548" y="468" font-size="11" fill="#000000">PIN_02 RX1</text>
  <text x="548" y="484" font-size="11" fill="#000000">PIN_01 TX1</text>
  <text x="548" y="500" font-size="11" fill="#000000">GND</text>
  <!-- crossover wires -->
  <polyline points="460,316 524,316 524,464 540,464" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,332 516,332 516,480 540,480" fill="none" stroke="#000000" stroke-width="1.3"/>
  <polyline points="460,348 508,348 508,496 540,496" fill="none" stroke="#000000" stroke-width="1.3"/>
  <text x="500" y="404" font-size="10" text-anchor="end" fill="#000000">UART1 · 115200 8N1 · '$'-terminated</text>

  <!-- Caption -->
  <text x="24" y="544" font-size="10" fill="#000000">PIN_50 (GSPI_CS) and PIN_06 (GSPI_MISO) are configured by pin_mux_config.c but unused — the OLED driver drives CS and DC by GPIO.</text>
</svg>
