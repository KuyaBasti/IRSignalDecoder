<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" width="1000" height="668" role="img" aria-label="IR Signal Decoder wiring, pins per pin_mux_config.c. IR receiver: OUT to CC3200 PIN_58, VCC to 3V3, GND to GND; IR light arrives from the remote. Adafruit SSD1351 OLED over SPI at 100 kHz: VIN to 3V3, GND to GND, SI (MOSI) to PIN_07, CL (SCK) to PIN_05, OC (CS) to PIN_18, DC to PIN_45, R (RST) to PIN_08. UART0 at 115200 8N1 to the USB debug console on the on-board USB backchannel: PIN_55 TX0 to console RX, PIN_57 RX0 to console TX. UART1 at 115200 8N1, dollar-terminated, to a second CC3200 running the same firmware: PIN_01 TX1 to its PIN_02 RX1, PIN_02 RX1 to its PIN_01 TX1, GND to GND. PIN_50 and PIN_06 are configured but not connected.">
  <style>
    .bg{fill:#ffffff}
    .title{fill:#1f2328;font:600 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .sub{fill:#59636e;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lbl{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .note{fill:#59636e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .glbl{fill:#59636e;font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.06em}
    .elbl{fill:#59636e;font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{stroke:#818b98;stroke-width:1.6;fill:none}
    .edge-dash{stroke:#818b98;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
    .arrow{fill:#818b98}
    .group{fill:none;stroke:#d1d9e0;stroke-width:1.2;stroke-dasharray:4 4}
    .b-blue{fill:#ddf4ff;stroke:#54aeff;stroke-width:1.5}
    .b-green{fill:#dafbe1;stroke:#4ac26b;stroke-width:1.5}
    .b-purple{fill:#fbefff;stroke:#c297ff;stroke-width:1.5}
    .b-orange{fill:#fff1e5;stroke:#fb8f44;stroke-width:1.5}
    .b-gray{fill:#f6f8fa;stroke:#d1d9e0;stroke-width:1.5}
    .b-red{fill:#ffebe9;stroke:#ff8182;stroke-width:1.5}
    .b-planned{fill:none;stroke:#818b98;stroke-width:1.4;stroke-dasharray:5 4}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .wire{stroke:#59636e;stroke-width:1.4;fill:none}
    .dot{fill:#59636e}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .title,.lbl{fill:#e6edf3}
      .sub,.note,.glbl,.elbl{fill:#9198a1}
      .edge,.edge-dash{stroke:#9198a1}
      .arrow{fill:#9198a1}
      .group{stroke:#3d444d}
      .b-blue{fill:#0c2d6b;stroke:#4493f8}
      .b-green{fill:#0f3b1e;stroke:#3fb950}
      .b-purple{fill:#2e1a4f;stroke:#ab7df8}
      .b-orange{fill:#3d1f0a;stroke:#f0883e}
      .b-gray{fill:#151b23;stroke:#3d444d}
      .b-red{fill:#3c1618;stroke:#f85149}
      .b-planned{stroke:#9198a1}
      .wire{stroke:#9198a1}
      .dot{fill:#9198a1}
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="668" rx="12"/>
  <text class="title" x="32" y="48">IR Signal Decoder — wiring</text>
  <text class="sub" x="32" y="74">Pins per pin_mux_config.c: IR in on PIN_58, OLED on GSPI + GPIO, UART0 to USB, UART1 to a second CC3200.</text>

  <!-- ===== CC3200 LaunchPad ===== -->
  <rect class="b-blue" x="440" y="104" width="220" height="404" rx="10"/>
  <text class="lbl" x="550" y="130" text-anchor="middle">CC3200 LaunchPad</text>
  <!-- left column pins -->
  <text class="note mono" x="452" y="160">PIN_58 (IR)</text>
  <text class="note mono" x="452" y="184">3V3</text>
  <text class="note mono" x="452" y="208">GND</text>
  <text class="note mono" x="452" y="440">PIN_55 TX0</text>
  <text class="note mono" x="452" y="464">PIN_57 RX0</text>
  <!-- right column pins -->
  <text class="note mono" x="648" y="160" text-anchor="end">3V3</text>
  <text class="note mono" x="648" y="184" text-anchor="end">GND</text>
  <text class="note mono" x="648" y="220" text-anchor="end">PIN_07 MOSI</text>
  <text class="note mono" x="648" y="244" text-anchor="end">PIN_05 CLK</text>
  <text class="note mono" x="648" y="280" text-anchor="end">PIN_18 CS</text>
  <text class="note mono" x="648" y="304" text-anchor="end">PIN_45 DC</text>
  <text class="note mono" x="648" y="328" text-anchor="end">PIN_08 RST</text>
  <text class="note mono" x="648" y="368" text-anchor="end">PIN_50 (n.c.)</text>
  <text class="note mono" x="648" y="392" text-anchor="end">PIN_06 (n.c.)</text>
  <text class="note mono" x="648" y="440" text-anchor="end">PIN_01 TX1</text>
  <text class="note mono" x="648" y="464" text-anchor="end">PIN_02 RX1</text>
  <text class="note mono" x="648" y="488" text-anchor="end">GND</text>

  <!-- ===== IR receiver (demodulator) ===== -->
  <rect class="b-orange" x="150" y="110" width="170" height="116" rx="10"/>
  <text class="lbl" x="235" y="134" text-anchor="middle">IR receiver</text>
  <text class="note mono" x="308" y="160" text-anchor="end">OUT</text>
  <text class="note mono" x="308" y="184" text-anchor="end">VCC</text>
  <text class="note mono" x="308" y="208" text-anchor="end">GND</text>
  <circle class="b-orange" data-part="IR window" cx="150" cy="168" r="9"/>
  <path class="edge" d="M82,142 L136,160" marker-end="url(#ah)"/>
  <path class="edge" d="M82,166 L136,176" marker-end="url(#ah)"/>
  <text class="elbl" x="40" y="204">IR from remote</text>
  <!-- IR receiver -> CC3200 -->
  <path class="wire" d="M320,156 H440"/>
  <path class="wire" d="M320,180 H440"/>
  <path class="wire" d="M320,204 H440"/>

  <!-- ===== Adafruit SSD1351 OLED ===== -->
  <rect class="b-purple" x="776" y="104" width="196" height="268" rx="10"/>
  <text class="lbl" x="874" y="130" text-anchor="middle">Adafruit SSD1351 OLED</text>
  <text class="note mono" x="788" y="160">VIN</text>
  <text class="note mono" x="788" y="184">GND</text>
  <text class="note mono" x="788" y="220">SI (MOSI)</text>
  <text class="note mono" x="788" y="244">CL (SCK)</text>
  <text class="note mono" x="788" y="280">OC (CS)</text>
  <text class="note mono" x="788" y="304">DC</text>
  <text class="note mono" x="788" y="328">R (RST)</text>
  <text class="note" x="874" y="356" text-anchor="middle">128 × 128 RGB565</text>
  <!-- CC3200 -> OLED -->
  <path class="wire" d="M660,156 H776"/>
  <path class="wire" d="M660,180 H776"/>
  <path class="wire" d="M660,216 H776"/>
  <path class="wire" d="M660,240 H776"/>
  <path class="wire" d="M660,276 H776"/>
  <path class="wire" d="M660,300 H776"/>
  <path class="wire" d="M660,324 H776"/>
  <text class="elbl" x="718" y="203" text-anchor="middle">SPI 100 kHz</text>

  <!-- ===== USB debug console (UART0) ===== -->
  <rect class="b-gray" x="150" y="392" width="170" height="90" rx="10"/>
  <text class="lbl" x="235" y="416" text-anchor="middle">USB debug console</text>
  <text class="note" x="162" y="440">on-board USB</text>
  <text class="note" x="162" y="464">backchannel</text>
  <text class="note mono" x="308" y="440" text-anchor="end">RX</text>
  <text class="note mono" x="308" y="464" text-anchor="end">TX</text>
  <path class="wire" d="M440,436 H320"/>
  <path class="wire" d="M440,460 H320"/>
  <text class="elbl" x="380" y="410" text-anchor="middle">UART0</text>
  <text class="elbl" x="380" y="424" text-anchor="middle">115200 8N1</text>

  <!-- ===== Second CC3200 (UART1) ===== -->
  <rect class="b-blue" x="776" y="392" width="196" height="132" rx="10"/>
  <text class="lbl" x="874" y="416" text-anchor="middle">Second CC3200</text>
  <text class="note mono" x="788" y="440">PIN_02 RX1</text>
  <text class="note mono" x="788" y="464">PIN_01 TX1</text>
  <text class="note mono" x="788" y="488">GND</text>
  <text class="note" x="874" y="510" text-anchor="middle">same firmware</text>
  <path class="wire" d="M660,436 H776"/>
  <path class="wire" d="M660,460 H776"/>
  <path class="wire" d="M660,484 H776"/>
  <text class="elbl" x="718" y="396" text-anchor="middle">UART1</text>
  <text class="elbl" x="718" y="410" text-anchor="middle">115200 8N1</text>
  <text class="elbl" x="718" y="424" text-anchor="middle">'$'-terminated</text>

  <!-- ===== Caption ===== -->
  <text class="note" x="32" y="560">PIN_50 (GSPI_CS) and PIN_06 (GSPI_MISO) are configured by pin_mux_config.c but not wired — the OLED driver drives CS and DC by GPIO.</text>

  <!-- ===== Legend ===== -->
  <text class="glbl" x="32" y="596">LEGEND</text>
  <rect class="b-blue" x="32" y="608" width="26" height="14" rx="4"/>
  <text class="note" x="70" y="619">CC3200 LaunchPad</text>
  <rect class="b-purple" x="272" y="608" width="26" height="14" rx="4"/>
  <text class="note" x="310" y="619">SSD1351 OLED display</text>
  <rect class="b-orange" x="512" y="608" width="26" height="14" rx="4"/>
  <text class="note" x="550" y="619">IR receiver (input)</text>
  <rect class="b-gray" x="752" y="608" width="26" height="14" rx="4"/>
  <text class="note" x="790" y="619">USB debug console</text>
  <path class="wire" d="M32,641 H58"/>
  <text class="note" x="70" y="645">wire</text>
  <path class="edge" d="M272,635 L292,647" marker-end="url(#ah)"/>
  <text class="note" x="310" y="645">IR light (not a wire)</text>
</svg>
